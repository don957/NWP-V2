        .badge-count {

        .requests-grid {
            display: grid;

            gap: 1.5rem;
        }
        .request-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;

            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .request-card:hover {

        }
        .status-badge {

            padding: 0.25rem 0.75rem;

            font-size: 0.875rem;
            font-weight: 600;
            color: white;
        }
        .html-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        .html-container {

            display: flex;

        .html-toolbar {

            align-items: center;
        }
        .html-frame {
            flex: 1;
            overflow: auto;
            border: none;
            width: 100%;
        }
        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .close-btn:hover {

    </style>
