        .request-card {
            background: white;

            text-decoration: none;
            color: inherit;

        .request-card:hover {

        }
        .badge-image-container {
            width: 100%;
            height: 150px;

            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .badge-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;

        .back-link {

            color: #3b82f6;

        }
        .back-link:hover {
