        .badge-image-container {

            background: #f0f0f0;

            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            overflow: hidden;

        .html-viewer {

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        .html-container {

            height: 90%;

            background: white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;

        .html-toolbar {

            justify-content: space-between;
            align-items: center;
        }
        .html-frame {
            flex: 1;
            overflow: auto;
            border: none;
            width: 100%;
        }
        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
