        .request-card {
            background: white;

        .html-viewer {

            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            z-index: 1000;
        }
        .html-container {

        .html-toolbar {

            align-items: center;
        }
        .html-frame {
            flex: 1;

            border: none;
            width: 100%;
        }
        .close-btn {

            cursor: pointer;
        }
        .close-btn:hover {
