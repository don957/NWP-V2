            border-radius: 8px;
            padding: 1.5rem;

            color: inherit;

        .request-card:hover {

        }
        .badge-image-container {
            width: 100%;
            height: 150px;
            background: #f0f0f0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .badge-image-container img {

            max-height: 100%;
            object-fit: contain;

        .status-badge {

            font-size: 0.875rem;

        .back-link:hover {

        }
        .html-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        .html-container {
            width: 90%;
            height: 90%;
            margin: 5% auto;
            background: white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }
        .html-toolbar {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .html-frame {
            flex: 1;
            overflow: auto;
            border: none;
            width: 100%;
        }
        .close-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .close-btn:hover {
